services:
  backend:
    environment:
      NOVELFORGE_WORKFLOW_EXECUTION_MODE: external
      NOVELFORGE_WORKFLOW_DB_PATH: /app/data/workflow_runs.db
      NOVELFORGE_WORKFLOW_MAX_QUEUED_JOBS: "1000"
      NOVELFORGE_WORKFLOW_MAX_ACTIVE_PER_USER: "8"
      NOVELFORGE_WORKFLOW_TIMEOUT_SECONDS: "900"
      NOVELFORGE_WORKFLOW_DLQ_REPLAY_BATCH_MAX: "100"
      NOVELFORGE_WORKFLOW_ARCHIVE_AFTER_SECONDS: "604800"
      NOVELFORGE_WORKFLOW_ARCHIVE_BATCH_SIZE: "500"
      NOVELFORGE_WORKFLOW_WORKER_HISTORY_RETENTION_SECONDS: "604800"
      NOVELFORGE_WORKFLOW_WORKER_HISTORY_CLEANUP_BATCH_SIZE: "500"
      NOVELFORGE_WORKFLOW_WORKER_CONTROL_BATCH_MAX: "100"
      NOVELFORGE_WORKFLOW_ALERT_READY_JOBS: "100"
      NOVELFORGE_WORKFLOW_ALERT_OLDEST_READY_SECONDS: "60"
      NOVELFORGE_WORKFLOW_ALERT_DEAD_LETTERS: "10"
      NOVELFORGE_WORKFLOW_ALERT_WORKER_UTILIZATION: "0.9"

  worker:
    build:
      context: ./backend
    container_name: novelforge-worker
    working_dir: /app
    command:
      - python
      - -m
      - app.workers.workflow_worker
    environment:
      NOVELFORGE_WORKFLOW_EXECUTION_MODE: worker
      NOVELFORGE_WORKFLOW_DB_PATH: /app/data/workflow_runs.db
      NOVELFORGE_WORKFLOW_CONCURRENCY: "1"
      NOVELFORGE_WORKFLOW_LEASE_SECONDS: "12"
      NOVELFORGE_WORKFLOW_HEARTBEAT_SECONDS: "3"
      NOVELFORGE_WORKFLOW_MAX_RETRY_DELAY_SECONDS: "300"
      NOVELFORGE_WORKFLOW_MAX_QUEUED_JOBS: "1000"
      NOVELFORGE_WORKFLOW_MAX_ACTIVE_PER_USER: "8"
      NOVELFORGE_WORKFLOW_TIMEOUT_SECONDS: "900"
      NOVELFORGE_WORKFLOW_DLQ_REPLAY_BATCH_MAX: "100"
      NOVELFORGE_WORKFLOW_ARCHIVE_AFTER_SECONDS: "604800"
      NOVELFORGE_WORKFLOW_ARCHIVE_BATCH_SIZE: "500"
      NOVELFORGE_WORKFLOW_WORKER_HISTORY_RETENTION_SECONDS: "604800"
      NOVELFORGE_WORKFLOW_WORKER_HISTORY_CLEANUP_BATCH_SIZE: "500"
      NOVELFORGE_WORKFLOW_WORKER_CONTROL_BATCH_MAX: "100"
      NOVELFORGE_WORKFLOW_ALERT_READY_JOBS: "100"
      NOVELFORGE_WORKFLOW_ALERT_OLDEST_READY_SECONDS: "60"
      NOVELFORGE_WORKFLOW_ALERT_DEAD_LETTERS: "10"
      NOVELFORGE_WORKFLOW_ALERT_WORKER_UTILIZATION: "0.9"
      QWEN_BASE_URL: http://ollama:11434
      QWEN_MODEL: qwen3:8b
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
