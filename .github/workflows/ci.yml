name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      NOVELFORGE_NOVEL_DB_PATH: ${{ runner.temp }}/novels.db
      NOVELFORGE_WORKFLOW_DB_PATH: ${{ runner.temp }}/workflow_runs.db
      MEMORY_DB_PATH: ${{ runner.temp }}/memory.db
      EXTERNAL_KNOWLEDGE_DB_PATH: ${{ runner.temp }}/external_knowledge.db
      NOVELFORGE_TEMPORAL_GRAPH_DB_PATH: ${{ runner.temp }}/temporal_graph.db
      FAISS_INDEX_DIR: ${{ runner.temp }}/vector_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./backend
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run verify:bundle

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: novel-ai
    steps:
      - uses: actions/checkout@v4
      - name: Provide repository-standard docker-compose command
        run: |
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - run: docker-compose config --quiet
      - run: docker-compose -f docker-compose.yml -f docker-compose.worker.yml config --quiet
      - run: docker-compose build backend frontend
      - run: docker-compose -f docker-compose.yml -f docker-compose.worker.yml build worker
