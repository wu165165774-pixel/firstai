name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      NOVELFORGE_NOVEL_DB_PATH: /tmp/novelforge-ci-novels.db
      NOVELFORGE_WORKFLOW_DB_PATH: /tmp/novelforge-ci-workflow-runs.db
      MEMORY_DB_PATH: /tmp/novelforge-ci-memory.db
      EXTERNAL_KNOWLEDGE_DB_PATH: /tmp/novelforge-ci-external-knowledge.db
      NOVELFORGE_TEMPORAL_GRAPH_DB_PATH: /tmp/novelforge-ci-temporal-graph.db
      FAISS_INDEX_DIR: /tmp/novelforge-ci-vector-db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.lock
      - run: python -m pip check
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run verify:bundle

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: novel-ai
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provide repository-standard docker-compose command
        run: |
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - run: docker-compose config --quiet
      - run: docker-compose -f docker-compose.yml -f docker-compose.worker.yml config --quiet
      - run: docker-compose build backend frontend
      - run: docker-compose -f docker-compose.yml -f docker-compose.worker.yml build worker
